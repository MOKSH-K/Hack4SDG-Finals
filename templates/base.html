<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · FoodForAll</title>
  <meta name="description" content="FoodForAll rescues late-night restaurant surplus, feeds night-shift workers from dark stores and routes every unsold meal to NGOs.">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/icons/site.webmanifest">
  <meta name="theme-color" content="#355e3b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <script src="/static/vendor/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Surface scale (names kept from the dark theme): 900 page, 800 card, 700 subtle fill, 600 border, 500 input border, 950 text on solid buttons.
            night: { 950: "#ffffff", 900: "#f7f5ee", 850: "#fbfaf6", 800: "#ffffff", 700: "#f0ede3", 600: "#e6e1d3", 500: "#d5cdb9" },
            ink: { DEFAULT: "#2d332c", muted: "#5f6158", dim: "#7a796c" },
            rescue: { DEFAULT: "#355e3b", deep: "#264529" },
            moon: { DEFAULT: "#9a6212", deep: "#7c4e0e" },
            olive: { DEFAULT: "#5b7a2e", deep: "#465f22", soft: "#e9eedc" },
            alert: { DEFAULT: "#b42318" },
            sky2: { DEFAULT: "#2f6db5" },
          },
          fontFamily: {
            display: ['"Space Grotesk"', "Inter", "system-ui", "sans-serif"],
            sans: ["Inter", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-2xl border border-night-600 bg-night-800 p-5 shadow-sm shadow-[#2d332c]/5; }
      .card-title { @apply font-display text-lg font-semibold text-ink; }
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold transition disabled:cursor-not-allowed disabled:opacity-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-rescue/50 focus-visible:ring-offset-1; }
      .btn-primary { @apply btn bg-rescue text-white hover:bg-rescue-deep; }
      .btn-moon { @apply btn bg-olive text-white hover:bg-olive-deep; }
      .btn-ghost { @apply btn border border-night-500 bg-white text-ink hover:border-olive hover:bg-olive-soft; }
      .btn-danger { @apply btn border border-alert/50 text-alert hover:bg-alert/10; }
      .input { @apply w-full rounded-xl border border-night-500 bg-white px-3 py-2 text-sm text-ink placeholder:text-ink-dim focus:border-rescue focus:outline-none focus:ring-1 focus:ring-rescue; }
      .label { @apply mb-1 block text-xs font-medium uppercase tracking-wide text-ink-muted; }
      .chip { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium; }
      .kpi { @apply font-display text-3xl font-bold tabular-nums text-ink; }
      .muted { @apply text-ink-muted; }
      .table-head { @apply text-left text-xs font-medium uppercase tracking-wide text-ink-dim; }
      .seg { @apply rounded-lg border border-night-500 bg-white px-3 py-1.5 text-sm text-ink-muted transition hover:border-olive hover:text-ink; }
      .seg-on { @apply border-rescue bg-rescue text-white hover:text-white; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/lucide.min.js"></script>
  {% block head %}{% endblock %}
  <script src="/static/js/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body class="min-h-full bg-night-900 font-sans text-ink antialiased">
  <script>window.REQUIRED_ROLES = {{ required_roles | tojson }}; FFA.guard(window.REQUIRED_ROLES);</script>
  <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,rgba(91,122,46,0.07),transparent_55%),radial-gradient(ellipse_at_bottom_right,rgba(232,220,200,0.35),transparent_50%)]"></div>

  <header class="sticky top-0 z-40 border-b border-night-600 bg-white/90 backdrop-blur" x-data="navUser()">
    <nav class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-3">
      <a href="/" class="flex items-center gap-2 font-display text-lg font-bold">
        <img src="/static/icons/favicon.svg" alt="" class="h-8 w-8" width="32" height="32">
        <span>Food<span class="text-rescue">For</span>All</span>
      </a>
      <div class="ml-4 hidden items-center gap-1 text-sm md:flex">
        <template x-for="l in links()" :key="l.href">
          <a :href="l.href" class="rounded-lg px-3 py-1.5 hover:bg-night-700 hover:text-ink" :class="active(l.href) ? 'bg-olive-soft font-medium text-rescue' : 'text-ink-muted'" :aria-current="active(l.href) ? 'page' : null" x-text="l.label"></a>
        </template>
      </div>
      <div class="ml-auto flex items-center gap-2 text-sm">
        <template x-if="user">
          <div class="flex items-center gap-2">
            <a :href="home()" class="hidden max-w-[16rem] truncate text-ink-muted hover:text-ink sm:block" x-text="user.name"></a>
            <button class="btn-ghost px-3 py-1.5" @click="logout()" aria-label="Sign out"><i data-lucide="log-out" class="h-4 w-4"></i></button>
          </div>
        </template>
        <template x-if="!user"><a href="/login" class="btn-ghost px-3 py-1.5">Sign in</a></template>
      </div>
    </nav>
    <div class="flex gap-1 overflow-x-auto border-t border-night-600/40 px-4 py-2 text-xs md:hidden">
      <template x-for="l in links()" :key="l.href">
        <a :href="l.href" class="whitespace-nowrap rounded-lg px-2 py-1" :class="active(l.href) ? 'bg-olive-soft font-medium text-rescue' : 'text-ink-muted'" :aria-current="active(l.href) ? 'page' : null" x-text="l.label"></a>
      </template>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-7xl px-4 pb-10 pt-4 text-xs text-ink-dim">
    FoodForAll · Supporting UN SDG 2 (Zero Hunger) &amp; SDG 12.3 (halve food waste) · <a class="underline hover:text-ink" href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
  </footer>

  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[min(92vw,24rem)] flex-col gap-2" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
